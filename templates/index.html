<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>AI Chatbot</h1>
    </header>
    <main>
        <section id="chat-container">
            <div id="chat-box"></div>
            <input type="text" id="user-input" placeholder="Enter any question here...">
            <button id="send-button">Send</button>
        </section>
        <section id="response-container">
            <h2>Response:</h2>
            <div id="response-box"></div>
        </section>
    </main>

        <!-- Markdown parser(converts markdown into html)-->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- HTML sanitizer(DOMPurify sanitizes the html)-->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <!-- Your chatbot JavaScript -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    

</body>
</html>
